# Global gateway: region a is primary, region b is the backup. Retries a failed call on the other region.
upstream global {
  server gw-a:80 max_fails=2 fail_timeout=10s;
  server gw-b:80 backup;
}
server {
  listen 80;
  location / {
    proxy_pass http://global;
    proxy_buffering off;
    proxy_connect_timeout 1s;
    proxy_next_upstream error timeout http_502 http_503 non_idempotent;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 10s;
  }
}
