# Region gateway (envsubst fills R1 and R2). Two replicas; a replica that fails twice is skipped for 10 s.
upstream replicas {
  least_conn;
  server ${R1}:8000 max_fails=2 fail_timeout=10s;
  server ${R2}:8000 max_fails=2 fail_timeout=10s;
}
server {
  listen 80;
  location / {
    proxy_pass http://replicas;
    proxy_buffering off;
    proxy_connect_timeout 1s;
    proxy_next_upstream error timeout http_503 non_idempotent;
    proxy_next_upstream_tries 2;
  }
}
